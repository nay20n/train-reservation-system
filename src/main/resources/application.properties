spring.application.name=train-reservation-system

spring.datasource.url=jdbc:mysql://localhost:3306/train_reservation?serverTimezone=Asia/Seoul
spring.datasource.username=train
spring.datasource.password=1234

# SQL 파일은 src/main/resources/db/ 에 모아둔다
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql